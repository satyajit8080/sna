definitions:
  env_versions: &env_versions
    # Apple rejects uploads built with anything older than the iOS 26 SDK.
    # 26.4 is Codemagic's current default; `latest` resolves to the same image.
    xcode: 26.4
    cocoapods: default

  # Hardcoding a simulator name breaks whenever Xcode ships a new device
  # lineup, so the destination is discovered at runtime instead.
  pick_simulator: &pick_simulator |
    SIM_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; ds=[d for r,v in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in v if d.get('isAvailable')]; p=[d for d in ds if 'iPhone' in d['name']] or ds; print(p[-1]['udid'] if p else '')")
    [ -n "$SIM_ID" ] || { echo "No iOS simulator available on this image"; exit 1; }
    echo "Simulator: $SIM_ID"

workflows:

  # ── PR checks — no signing, no upload ─────────────────────────────────────
  ios-test:
    name: iOS tests
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      <<: *env_versions
      vars:
        XCODE_PROJECT: "ios/SnapCal.xcodeproj"
        XCODE_SCHEME: "SnapCal"
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    scripts:
      - name: Validate the Xcode project before spending build minutes
        script: |
          python3 ios/tools/validate_xcodeproj.py
          python3 ios/tools/lint_swift.py

      - name: Backend typecheck and build
        script: |
          cd backend
          npm ci
          npm run typecheck
          npm run build

      - name: Build and test the app
        script: |
          set -e
          # xcbeautify is not on every Codemagic image. Pick whatever exists and
          # fall back to plain output rather than failing with 127.
          FORMATTER=cat
          command -v xcbeautify >/dev/null 2>&1 && FORMATTER=xcbeautify
          [ "$FORMATTER" = cat ] && command -v xcpretty >/dev/null 2>&1 && FORMATTER=xcpretty
          # Without pipefail the pipeline reports the formatter's status.
          set -o pipefail

          SIM_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; ds=[d for r,v in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in v if d.get('isAvailable')]; p=[d for d in ds if 'iPhone' in d['name']] or ds; print(p[-1]['udid'] if p else '')")
          [ -n "$SIM_ID" ] || { echo "No iOS simulator available on this image"; exit 1; }
          echo "Simulator: $SIM_ID"

          mkdir -p build
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "id=$SIM_ID" \
            -resultBundlePath build/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            clean test | $FORMATTER
    artifacts:
      - build/tests.xcresult

  # ── main → TestFlight ─────────────────────────────────────────────────────
  ios-testflight:
    name: iOS TestFlight release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *env_versions
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/SnapCal.xcodeproj"
        XCODE_SCHEME: "SnapCal"
        BUNDLE_ID: "app.snapcal.ios"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Validate project structure
        script: |
          python3 ios/tools/validate_xcodeproj.py
          python3 ios/tools/lint_swift.py

      - name: Guard against shipping a development API URL
        script: |
          set -e
          RELEASE_HOST=$(grep -E '^API_HOST' ios/Config/Release.xcconfig | sed 's/.*= *//')
          echo "Release API host: $RELEASE_HOST"
          case "$RELEASE_HOST" in
            *localhost*|*127.0.0.1*|"")
              echo "Release build points at a development host. Refusing to ship."
              exit 1 ;;
          esac
          grep -q 'API_SCHEME = https' ios/Config/Release.xcconfig || {
            echo "Release build is not HTTPS. Refusing to ship."
            exit 1
          }

      - name: Verify the production API is reachable
        script: |
          set -e
          RELEASE_HOST=$(grep -E '^API_HOST' ios/Config/Release.xcconfig | sed 's/.*= *//')
          BODY=$(curl -fsS --max-time 20 "https://$RELEASE_HOST/health") || {
            echo "Production /health did not respond. Deploy the backend first."
            exit 1
          }
          echo "$BODY"

          # "Something answered" is not enough: a wrong host that happens to be
          # online passed this check once already and shipped a broken build.
          echo "$BODY" | grep -q '"ok":true' || {
            echo "Host answered but is not the SnapCal API."
            exit 1
          }

          # A mock-provider backend returns a canned meal for every photo.
          echo "$BODY" | grep -q '"provider":"mock"' && {
            echo "Backend is running AI_PROVIDER=mock. Set it to openai before shipping."
            exit 1
          }
          true

      # Runs BEFORE signing on purpose. `use-profiles` switches the project to
      # Manual signing with an App Store distribution profile, and an app signed
      # that way cannot be installed on a simulator — it fails with
      # "Application is unknown to FrontBoard".
      - name: Run tests
        script: |
          set -e
          FORMATTER=cat
          command -v xcbeautify >/dev/null 2>&1 && FORMATTER=xcbeautify
          [ "$FORMATTER" = cat ] && command -v xcpretty >/dev/null 2>&1 && FORMATTER=xcpretty
          set -o pipefail

          SIM_ID=$(xcrun simctl list devices available --json | python3 -c "import json,sys; ds=[d for r,v in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in v if d.get('isAvailable')]; p=[d for d in ds if 'iPhone' in d['name']] or ds; print(p[-1]['udid'] if p else '')")
          [ -n "$SIM_ID" ] || { echo "No iOS simulator available on this image"; exit 1; }
          echo "Simulator: $SIM_ID"

          # UI tests run on pull requests, not here: they add ~90s and are
          # simulator-flaky, and a launch hiccup should not block a release
          # whose unit tests all pass.
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination "id=$SIM_ID" \
            -skip-testing:SnapCalUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | $FORMATTER

      - name: Set build number from the latest TestFlight build
        script: |
          set -e
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          NEXT=$(( ${LATEST:-0} + 1 ))
          echo "Build number: $NEXT"
          agvtool new-version -all "$NEXT"

      - name: Fetch signing files
        script: |
          set -e
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is not set."
            echo "Apple issues a certificate against a private key you own; without"
            echo "it there is nothing to attach the signed certificate to."
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: Archive and export IPA
        script: |
          set -e
          mkdir -p build
          # build-ipa archives and exports in one pass — there is no separate
          # export subcommand. On failure, pull the real errors out of the
          # xcodebuild logs it leaves behind.
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release || {
              echo ""
              echo "═══ errors from the xcodebuild logs ═══"
              grep -hnE "error:|No profiles|doesn't include|Signing for" /tmp/xcodebuild_logs/*.log 2>/dev/null | head -40 || true
              exit 1
            }
          echo "── exported ──"
          ls -lh build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

        # The IPA uploads and processes regardless of the flags below.
        # Internal testers (your own team, up to 100) can install it straight
        # away — no review, no test information needed.
        #
        # `submit_to_testflight: true` means "submit for Beta App Review", which
        # is only for EXTERNAL testers. Apple then demands Beta App Information
        # (feedback email) and Beta App Review Information (name, phone, email).
        # Turn it on once those are filled in at:
        #   App Store Connect → your app → TestFlight → Test Information
        submit_to_testflight: false

        # `beta_groups` only accepts groups that already exist, and only
        # external ones. Create the group in App Store Connect first, then
        # uncomment with the exact name.
        # beta_groups:
        #   - External Testers

        submit_to_app_store: false
      email:
        recipients:
          - satyajitdhumal07@gmail.com
        notify:
          success: true
          failure: true
