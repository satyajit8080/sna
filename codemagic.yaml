# BP Coach — build, test and verify
#
# Runs the security sweep, builds and tests the iOS app on real macOS/Xcode,
# then builds and tests the backend.
# No stage fabricates a result: each prints raw command output or exits non-zero
# with an explicit BLOCKED marker.
#
# Project generation: XcodeGen from project.yml. The .xcodeproj is NOT committed —
# it is generated fresh on every run, so project.yml cannot drift from reality.

workflows:
  bp-coach:
    name: BP Coach — Build & Test
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest
      vars:
        PROJECT_NAME: BPCoach
        SCHEME_NAME: BPCoach
        EXPECTED_DEPLOYMENT_TARGET: "17.0"
        # "latest" installs the current Homebrew build and prints its version.
        # Replace with a tag from https://github.com/yonaskolb/XcodeGen/releases
        # (e.g. "2.42.0") once you have read the real version from stage A6.
        # CodeMagic rejects empty values, so this is a sentinel rather than "".
        XCODEGEN_VERSION: "latest"
        # Public base URL of the Railway backend — not a secret. Override in the
        # CodeMagic UI. Left empty here on purpose: an unset value produces a
        # valid build where the coach and food search report themselves
        # unavailable, which is a legitimate configuration.
        BPCOACH_API_BASE_URL: "unset"

    triggering:
      events:
        - push
      branch_patterns:
        # You are working on main. Both are watched so a manual build is not
        # required after every push.
        - pattern: main
          include: true
        - pattern: bp-coach
          include: true

    scripts:

      # ══════════════════════════════════════════════════════════
      # STAGE A — environment evidence
      # ══════════════════════════════════════════════════════════

      - name: A0 · Security sweep (gate)
        script: |
          set -e
          chmod +x scripts/security-check.sh
          ./scripts/security-check.sh

      - name: A1 · Xcode version
        script: |
          set -x
          xcodebuild -version

      - name: A2 · Swift version
        script: |
          set -x
          swift --version

      - name: A3 · Available iOS SDKs
        script: |
          set -x
          xcodebuild -showsdks
          echo "--- iphoneos / iphonesimulator ---"
          xcodebuild -showsdks | grep -iE 'iphoneos|iphonesimulator' || true

      - name: A4 · Available simulator destinations
        script: |
          set -x
          xcrun simctl list runtimes
          echo "--- available iPhone devices ---"
          xcrun simctl list devices available | grep -i iphone

      - name: A5 · Git commit and working-tree state
        script: |
          set -x
          git rev-parse HEAD
          git log -1 --format='%H%n%an%n%cd%n%s'
          git branch --show-current
          echo "--- porcelain (empty means clean) ---"
          git status --porcelain
          echo "--- remotes ---"
          git remote -v
          echo "--- submodules (expect none) ---"
          cat .gitmodules 2>/dev/null || echo "no .gitmodules — good"
          echo "--- confirm no committed .xcodeproj ---"
          git ls-files | grep -c 'xcodeproj' || echo "0 — correct, project is generated"
          echo "--- confirm no SnapCal source copied ---"
          git ls-files | grep -i snapcal || echo "none — correct"

      # ══════════════════════════════════════════════════════════
      # STAGE B — project generation and discovery
      # ══════════════════════════════════════════════════════════

      - name: A6 · Install XcodeGen
        script: |
          set -e
          if [ "$XCODEGEN_VERSION" = "latest" ]; then
            echo "Installing the latest XcodeGen from Homebrew (unpinned)."
            brew install xcodegen
          else
            # Pinned: fetch the exact release artifact rather than whatever
            # Homebrew currently ships, so builds stay reproducible.
            echo "Installing pinned XcodeGen $XCODEGEN_VERSION"
            URL="https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
            curl -fsSL "$URL" -o /tmp/xcodegen.zip || {
              echo "BLOCKED: no release artifact for tag '$XCODEGEN_VERSION'."
              echo "Check https://github.com/yonaskolb/XcodeGen/releases for valid tags."
              exit 1
            }
            unzip -q -o /tmp/xcodegen.zip -d /tmp/xcodegen
            BIN=$(find /tmp/xcodegen -type f -name xcodegen -perm +111 | head -1)
            [ -n "$BIN" ] || { echo "BLOCKED: no xcodegen binary in the archive"; exit 1; }
            chmod +x "$BIN"
            mkdir -p "$HOME/.local/bin"
            cp "$BIN" "$HOME/.local/bin/xcodegen"
            echo "PATH=$HOME/.local/bin:$PATH" >> $CM_ENV
            export PATH="$HOME/.local/bin:$PATH"
          fi

          echo "--- RECORD THIS VERSION AND PIN IT IN XCODEGEN_VERSION ---"
          xcodegen --version

      - name: B1 · Generate the Xcode project
        script: |
          set -ex
          [ -f project.yml ] || { echo "BLOCKED: project.yml missing"; exit 1; }
          xcodegen generate --spec project.yml --project . 2>&1 | tee /tmp/xcodegen.log

      - name: B2 · Verify the project was generated
        script: |
          set -e
          if [ ! -d "${PROJECT_NAME}.xcodeproj" ]; then
            echo "=============================================="
            echo "PHASE 0 GATE: BLOCKED"
            echo "XcodeGen did not produce ${PROJECT_NAME}.xcodeproj."
            echo "No build or test result may be claimed."
            echo "=============================================="
            exit 1
          fi
          echo "OK: ${PROJECT_NAME}.xcodeproj generated"
          ls -la "${PROJECT_NAME}.xcodeproj"

      - name: B3 · xcodebuild -list
        script: |
          set -ex
          xcodebuild -list -project "${PROJECT_NAME}.xcodeproj" | tee /tmp/schemes.txt
          grep -q "$SCHEME_NAME" /tmp/schemes.txt || {
            echo "BLOCKED: expected scheme $SCHEME_NAME not found"; exit 1; }

      - name: B4 · Resolve backend URL
        script: |
          set -e
          if [ "$BPCOACH_API_BASE_URL" = "unset" ] || [ -z "$BPCOACH_API_BASE_URL" ]; then
            echo "No backend URL configured."
            echo "The app will build and run with the coach and food search"
            echo "reporting themselves unavailable. This is a valid build."
            echo "API_BASE_URL=" >> $CM_ENV
          else
            # Trailing slashes break URL(string:).appendingPathComponent joins.
            CLEANED=$(echo "$BPCOACH_API_BASE_URL" | sed 's:/*$::')
            echo "Backend URL: $CLEANED"
            case "$CLEANED" in
              https://*) ;;
              *) echo "BLOCKED: backend URL must use https"; exit 1 ;;
            esac
            echo "API_BASE_URL=$CLEANED" >> $CM_ENV
          fi

      - name: B5 · Resolve simulator destination
        script: |
          set -ex
          xcodebuild -project "${PROJECT_NAME}.xcodeproj" -scheme "$SCHEME_NAME" \
            -showdestinations 2>&1 | tee /tmp/destinations.txt

          # First available iOS Simulator entry, as printed by Xcode itself.
          # TARGETED_DEVICE_FAMILY is "1" (iPhone), so an iPad destination is
          # wrong even when it is listed as available.
          DEST_NAME=$(grep 'platform:iOS Simulator' /tmp/destinations.txt \
                      | grep -v 'placeholder' \
                      | grep -i 'iPhone' \
                      | head -1 \
                      | sed -n 's/.*name:\([^,}]*\).*/\1/p' \
                      | sed 's/^ *//;s/ *$//')
          [ -n "$DEST_NAME" ] || { echo "BLOCKED: no simulator destination"; exit 1; }
          echo "Resolved destination: [$DEST_NAME]"
          echo "DEST_NAME=$DEST_NAME" >> $CM_ENV

      # ══════════════════════════════════════════════════════════
      # STAGE C — build, test, target, bundle
      # ══════════════════════════════════════════════════════════

      - name: C1 · Build verification
        script: |
          set -ex
          # The URL must be passed as a build setting. A CodeMagic environment
          # variable is a shell variable; xcodebuild does not read it as one.
          xcodebuild build \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "$SCHEME_NAME" \
            -destination "platform=iOS Simulator,name=$DEST_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            BPCOACH_API_BASE_URL="$API_BASE_URL" \
            2>&1 | tee /tmp/build.log | xcpretty --simple --color || true

          if ! grep -q "BUILD SUCCEEDED" /tmp/build.log; then
            echo ""
            echo "=================== COMPILER ERRORS ==================="
            # The useful lines are buried in a very verbose transcript, so pull
            # them out explicitly rather than tailing the end of the log.
            grep -E "error:" /tmp/build.log \
              | grep -vE "CoreData: error:|Mount (on|from) name|i-nodes|data blocks|File system" \
              | sed 's|/Users/builder/clone/||' | sort -u | head -80
            echo "======================================================="
            echo ""
            grep -E "^\s+~+\^|^\s+\^" /tmp/build.log | head -20 || true
            exit 1
          fi

      - name: C2 · Test verification
        script: |
          set -ex
          xcodebuild test \
            -project "${PROJECT_NAME}.xcodeproj" \
            -scheme "$SCHEME_NAME" \
            -destination "platform=iOS Simulator,name=$DEST_NAME" \
            CODE_SIGNING_ALLOWED=NO \
            BPCOACH_API_BASE_URL="$API_BASE_URL" \
            2>&1 | tee /tmp/test.log | xcpretty --simple --color || true

          if ! grep -qE "TEST SUCCEEDED|TEST EXECUTE SUCCEEDED" /tmp/test.log; then
            echo "=================== TEST FAILURES ==================="
            # CoreData emits hundreds of "error:" lines describing filesystem
            # state whenever a store fails to open. Those drown out the actual
            # failure, so they are filtered rather than tailed.
            grep -E "error:|failed|XCTAssert|Expectation failed|Test Case.*failed" /tmp/test.log \
              | grep -vE "CoreData: (error|annotation):|Mount (on|from) name|i-nodes|data blocks|File system|Filesystem|Device ID|File (Size|inode|user ID|group ID|Permissions)|Owner UID|Sandbox access|Executing as effective user|^-+$" \
              | sed 's|/Users/builder/clone/||' | sort -u | head -60
            echo ""
            echo "--- first store-open failure, if any ---"
            grep -m3 -E "Failed to (stat|statfs)|NSPersistentStoreCoordinator|Could not create|SwiftData" /tmp/test.log | head -5
            echo "===================================================="
            exit 1
          fi
          echo "--- confirm no skipped tests ---"
          grep -c "Test skipped" /tmp/test.log || echo "0 skipped — correct"

      - name: C3 · Deployment target verification
        script: |
          set -ex
          # Anchor on the setting name. A loose grep also matches
          # DEPLOYMENT_TARGET_SETTING_NAME = IPHONEOS_DEPLOYMENT_TARGET, whose
          # value is the setting's *name* rather than a version number.
          xcodebuild -project "${PROJECT_NAME}.xcodeproj" -scheme "$SCHEME_NAME" \
            -showBuildSettings 2>/dev/null \
            | grep -E "^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = " \
            | tee /tmp/target.txt

          [ -s /tmp/target.txt ] || {
            echo "BLOCKED: IPHONEOS_DEPLOYMENT_TARGET not found in build settings"; exit 1; }

          # Every target in the scheme is checked, not just the first — the app
          # and the test bundle must agree.
          # Trim per line with sed, not `tr -d [:space:]` — tr would also strip
          # the newlines and concatenate "17.0" and "17.0" into "17.017.0".
          VALUES=$(sed -E 's/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = //; s/[[:space:]]*$//' \
                   /tmp/target.txt | sort -u)
          echo "Declared: [$(echo $VALUES | tr '\n' ' ')] · Expected: $EXPECTED_DEPLOYMENT_TARGET"

          for VALUE in $VALUES; do
            if [ "$VALUE" != "$EXPECTED_DEPLOYMENT_TARGET" ]; then
              echo "BLOCKED: a target declares iOS $VALUE, not $EXPECTED_DEPLOYMENT_TARGET"
              exit 1
            fi
          done
          echo "OK: build and tests above succeeded at iOS $EXPECTED_DEPLOYMENT_TARGET"

      - name: C4 · PNG bundle exclusion check
        script: |
          set -ex
          APP=$(find ~/Library/Developer/Xcode/DerivedData "${CM_BUILD_DIR}" \
                 -name "${PROJECT_NAME}.app" -type d 2>/dev/null | head -1)
          [ -n "$APP" ] || { echo "BLOCKED: no .app produced"; exit 1; }
          echo "App bundle: $APP"
          echo "--- bundle contents ---"
          ls -la "$APP"
          echo "--- design-reference PNGs (expect none) ---"
          find "$APP" -name 'part-*.png' | tee /tmp/pngs.txt
          [ ! -s /tmp/pngs.txt ] || { echo "BLOCKED: design PNGs are bundled"; exit 1; }
          echo "OK: no design-reference PNG in the bundle"

      # ══════════════════════════════════════════════════════════
      # STAGE D — iOS 17.0 API availability probe
      # ══════════════════════════════════════════════════════════

      - name: C5 · Confirm the backend URL reached the bundle
        script: |
          set -e
          APP=$(find ~/Library/Developer/Xcode/DerivedData "${CM_BUILD_DIR}" \
                 -name "${PROJECT_NAME}.app" -type d 2>/dev/null | head -1)
          [ -n "$APP" ] || { echo "BLOCKED: no .app produced"; exit 1; }

          BAKED=$(/usr/libexec/PlistBuddy -c "Print :BPCoachAPIBaseURL" \
                  "$APP/Info.plist" 2>/dev/null || echo "")
          echo "Info.plist BPCoachAPIBaseURL = '$BAKED'"

          if [ -n "$API_BASE_URL" ] && [ "$BAKED" != "$API_BASE_URL" ]; then
            echo "BLOCKED: the URL did not reach the bundle."
            echo "Expected '$API_BASE_URL', found '$BAKED'."
            exit 1
          fi
          echo "OK"

      # The invariant sweep that used to sit here duplicated stage A0 with an
      # older, looser copy of the same checks — and its SnapCal test matched
      # docs/SNAPCAL_AUDIT.md, the audit document itself. A0 runs
      # scripts/security-check.sh, which is the single source of truth.

      - name: Z · Evidence summary
        script: |
          echo "════════════════════════════════════════"
          echo "PHASE 0 EVIDENCE — all output above is raw."
          echo "Any stage that did not run leaves its gate BLOCKED."
          echo "════════════════════════════════════════"
          echo "XcodeGen version (pin this):"; xcodegen --version
          echo "Commit:"; git rev-parse HEAD

      - name: E1 · Backend build and tests
        script: |
          set -ex
          cd backend
          node --version
          npm ci
          npx tsc --noEmit
          npm run build
          node --test test/*.test.js

    artifacts:
      - /tmp/*.log
      - /tmp/*.txt

    # No publishing block. CodeMagic emails build results to the account owner
    # by default, and a `recipients` entry that resolves to an unset variable is
    # a hard validation error rather than a silent skip.
    #
    # To email someone else, use a literal address below (an unset variable
    # reference is a validation error) and uncomment:
    #
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
    #     notify:
    #       success: true
    #       failure: true

  # ─────────────────────────────────────────────────────────────────────
  # RELEASE — signs, archives and uploads to TestFlight.
  #
  # Separate from the CI workflow on purpose. CI builds for the simulator
  # unsigned, which is fast and needs no Apple account; this one needs a
  # paid Developer account, an App Store Connect API key, and a registered
  # bundle identifier. Running them together would make every commit wait
  # on signing.
  #
  # Trigger manually, or on a tag, once CI is green.
  # ─────────────────────────────────────────────────────────────────────
  release:
    name: BP Coach — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      # Create this in CodeMagic: Teams → Integrations → Developer Portal,
      # using an App Store Connect API key with App Manager access.
      app_store_connect: BPCoachASC

    environment:
      xcode: latest
      # No `ios_signing:` block on purpose. It fetches profiles before any
      # script runs and cannot create a missing one, which fails with
      # "No matching profiles found". R4 does it explicitly with --create.
      vars:
        PROJECT_NAME: BPCoach
        SCHEME_NAME: BPCoach
        BUNDLE_ID: app.snapcal.ios
        BPCOACH_API_BASE_URL: "unset"
      groups:
        - appstore   # optional: holds APP_STORE_APPLE_ID if you use it

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: R0 · Security sweep (gate)
        script: |
          set -e
          chmod +x scripts/security-check.sh
          ./scripts/security-check.sh

      - name: R1 · Generate the Xcode project
        script: |
          set -ex
          brew install xcodegen
          xcodegen generate --spec project.yml --project .
          [ -d "${PROJECT_NAME}.xcodeproj" ] || { echo "BLOCKED: no project generated"; exit 1; }

      - name: R2 · Resolve backend URL
        script: |
          set -e
          if [ "$BPCOACH_API_BASE_URL" = "unset" ] || [ -z "$BPCOACH_API_BASE_URL" ]; then
            echo "WARNING: shipping to TestFlight with no backend URL."
            echo "The coach and food search will report themselves unavailable."
            echo "API_BASE_URL=" >> $CM_ENV
          else
            CLEANED=$(echo "$BPCOACH_API_BASE_URL" | sed 's:/*$::')
            case "$CLEANED" in
              https://*) ;;
              *) echo "BLOCKED: backend URL must use https"; exit 1 ;;
            esac
            echo "Backend URL: $CLEANED"
            echo "API_BASE_URL=$CLEANED" >> $CM_ENV
          fi

      - name: R3 · Set the build number
        script: |
          set -e
          # TestFlight rejects a build number it has already seen, so it is
          # derived from the latest build already uploaded rather than from
          # the value committed in project.yml.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          NEXT=$(( ${LATEST:-0} + 1 ))
          echo "Latest on TestFlight: ${LATEST:-0} · uploading as: $NEXT"
          echo "BUILD_NUMBER=$NEXT" >> $CM_ENV

      - name: R3b · Diagnose the signing account
        script: |
          set +e
          echo "=== Bundle IDs visible to this API key ==="
          app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" 2>&1 | head -30
          echo ""
          echo "=== Distribution certificates on the account ==="
          app-store-connect list-certificates --type IOS_DISTRIBUTION 2>&1 | head -30
          echo ""
          echo "=== Existing App Store profiles ==="
          app-store-connect list-profiles --profile-type IOS_APP_STORE 2>&1 | head -40
          echo ""
          echo "If the bundle ID list is empty, the App ID is not registered on"
          echo "this team, or the API key belongs to a different team."
          echo "If there are no certificates, the key needs the Admin role to"
          echo "create one — App Manager cannot create certificates."
          set -e

      - name: R4 · Apply signing profiles
        script: |
          set -e

          # A signing certificate is a public certificate plus a private key.
          # Apple issues the certificate; the private key is yours and Apple
          # never sees it. The CLI cannot save a certificate without one, so
          # there is no useful fallback here — fail early and say why.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "=============================================="
            echo "BLOCKED: CERTIFICATE_PRIVATE_KEY is not set."
            echo ""
            echo "It must be added as an environment variable AND placed in a"
            echo "group this workflow imports. That group is: appstore"
            echo ""
            echo "A variable with no group, or in a group not listed under"
            echo "environment.groups, exists in the UI but never reaches the"
            echo "build — which is what has happened here."
            echo ""
            echo "CodeMagic → app settings → Environment variables:"
            echo "  name   : CERTIFICATE_PRIVATE_KEY"
            echo "  value  : the whole PEM key, both BEGIN and END lines"
            echo "  group  : appstore"
            echo "  secure : ticked"
            echo "=============================================="
            echo ""
            echo "Variables this build CAN see (names only, no values):"
            env | cut -d= -f1 | grep -iE 'CERT|KEY|BUNDLE|BPCOACH|APP' | sort || true
            exit 1
          fi

          echo "CERTIFICATE_PRIVATE_KEY is present (${#CERTIFICATE_PRIVATE_KEY} chars)."
          case "$CERTIFICATE_PRIVATE_KEY" in
            *"BEGIN RSA PRIVATE KEY"*|*"BEGIN PRIVATE KEY"*) echo "Format looks right." ;;
            *) echo "BLOCKED: the value is not a PEM private key."
               echo "It must start with -----BEGIN RSA PRIVATE KEY----- and"
               echo "include every line through -----END RSA PRIVATE KEY-----."
               exit 1 ;;
          esac

          keychain initialize

          # Reusing the same key each build keeps one certificate. A fresh key
          # would issue a new one, and Apple caps distribution certificates.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --platform IOS \
            --create \
            --certificate-key="@env:CERTIFICATE_PRIVATE_KEY"

          keychain add-certificates
          xcode-project use-profiles

      - name: R5 · Build the archive and IPA
        script: |
          set -ex
          xcode-project build-ipa \
            --project "${PROJECT_NAME}.xcodeproj" \
            --scheme "$SCHEME_NAME" \
            -- \
            BPCOACH_API_BASE_URL="$API_BASE_URL" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: R6 · Verify what is inside the IPA
        script: |
          set -e
          IPA=$(find build/ios/ipa -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "BLOCKED: no IPA produced"; exit 1; }
          echo "IPA: $IPA"

          rm -rf /tmp/ipa && mkdir -p /tmp/ipa && unzip -q "$IPA" -d /tmp/ipa
          APP=$(find /tmp/ipa/Payload -maxdepth 1 -name '*.app' | head -1)

          echo "--- bundle identifier ---"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

          echo "--- backend URL baked in ---"
          BAKED=$(/usr/libexec/PlistBuddy -c "Print :BPCoachAPIBaseURL" "$APP/Info.plist" 2>/dev/null || echo "")
          echo "'$BAKED'"
          if [ -n "$API_BASE_URL" ] && [ "$BAKED" != "$API_BASE_URL" ]; then
            echo "BLOCKED: backend URL did not reach the shipped bundle"; exit 1
          fi

          echo "--- HealthKit usage strings present? ---"
          /usr/libexec/PlistBuddy -c "Print :NSHealthShareUsageDescription" "$APP/Info.plist" \
            || { echo "BLOCKED: missing NSHealthShareUsageDescription — App Review rejects this"; exit 1; }

          echo "--- design references must not be shipped ---"
          find "$APP" -name 'part-*.png' | grep . && { echo "BLOCKED: design PNG in the IPA"; exit 1; } || echo "OK"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # No external testers by default — internal testers get it immediately,
        # external groups require Beta App Review.
        # beta_groups:
        #   - Internal Testers
