name: BPCoach

options:
  minimumXcodeGenVersion: "2.35.0"
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Signing is disabled here so the CI workflow can build and test against
    # the simulator with no Apple account. The release workflow overrides this
    # with CODE_SIGNING_ALLOWED=YES in --archive-xcargs, and `use-profiles`
    # fills in the identity, team and profile before the archive runs.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_STYLE: Manual

targets:
  BPCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        # Inherited from SnapCal. BP Coach ships as an update to the existing
        # App Store record, replacing a retired product. A different identifier
        # would create a separate app and orphan the existing users.
        PRODUCT_BUNDLE_IDENTIFIER: app.snapcal.ios
        PRODUCT_NAME: BPCoach
        # Overridden by CI. Never contains a secret — only a public base URL.
        BPCOACH_API_BASE_URL: $(inherited)
        # Must exceed SnapCal's last release (1.0.0). A version at or below the
        # published one is rejected on upload.
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BP Coach
        # Declares the standard export-compliance exemption: HTTPS only, no
        # custom cryptography. Without it, every TestFlight upload stops and
        # asks the question manually.
        ITSAppUsesNonExemptEncryption: false
        # Required by App Store validation for any app built against the iOS 11
        # SDK or later. Xcode only synthesises this when it generates the
        # Info.plist itself; this project supplies its own, so it is set here.
        CFBundleIconName: AppIcon
        # Injected at build time. Empty in the repo: no environment is baked in,
        # and an empty value makes the app fall back to unconfigured stubs.
        BPCoachAPIBaseURL: $(BPCOACH_API_BASE_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          BP Coach reads blood pressure, heart rate, HRV, sleep, steps and weight from
          Health to show your trends. This data stays on your device.
        # Each capability needs its own purpose string. A missing one is not a
        # warning — iOS terminates the app the moment the API is touched.
        NSCameraUsageDescription: >-
          BP Coach uses the camera to scan medical reports, prescriptions,
          medicine packaging and food barcodes. Images are read on your device.
        NSPhotoLibraryUsageDescription: >-
          BP Coach can read a report or prescription from a photo you choose.
          Photos are processed on your device and never uploaded.
        NSMicrophoneUsageDescription: >-
          BP Coach uses the microphone so you can dictate questions to the AI
          coach instead of typing them.
        NSSpeechRecognitionUsageDescription: >-
          Speech is transcribed on your device where supported, so what you say
          becomes text without being uploaded.
        NSHealthUpdateUsageDescription: >-
          BP Coach saves blood pressure readings you enter into Health so other apps
          you trust can use them.
    entitlements:
      path: Sources/BPCoach.entitlements
      properties:
        com.apple.developer.healthkit: true

  BPCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: BPCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapcal.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BPCoach:
    build:
      targets:
        BPCoach: all
        BPCoachTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BPCoachTests
    archive:
      config: Release
